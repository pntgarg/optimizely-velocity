query getHeaderData($domain: String, $locale: [Locales!]) {
  appLayout: LayoutSettingsBlock(
    where: {
      _or: [
        { appIdentifiers: { exist: false } }
        {
          _and: [
            { appIdentifiers: { exist: true } }
            { appIdentifiers: { eq: $domain } }
          ]
        }
      ]
    }
    locale: $locale
  ) {
    items {
      _metadata {
        key
        displayName
      }
      appIdentifiers
      layoutsitelogo {
        url {
          default
        }
      }
      mainMenu {
        ...IContentData
        ...MegaMenuGroupBlockData
      }
      serviceButtons {
        ...IContentData
      }
    }
  }
}

fragment IContentData on _IContent {
  _metadata {
    key
    displayName
    types
    url {
      default
    }
  }
}

fragment LinkItemData on Link {
  title
  text
  target
  url {
    default
    base
    hierarchical
  }
}

fragment MenuNavigationBlockData on MenuNavigationBlock {
  MenuNavigationHeading
  NavigationLinks {
    ...LinkItemData
  }
}

fragment MegaMenuGroupBlockData on MegaMenuGroupBlock {
  MenuMenuHeading
  MegaMenuUrl {
    default
    base
    hierarchical
  }
  MegaMenuContentArea {
    ...IContentData
    ...MenuNavigationBlockData
  }
}
